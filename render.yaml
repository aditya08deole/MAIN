services:
  # Python FastAPI Backend
  - type: web
    name: evara-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # ⚠️ Sensitive values — set these in the Render dashboard, NOT here
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_KEY
        sync: false  # Set in Render dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false  # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "8000"
      - key: BACKEND_CORS_ORIGINS
        value: https://evara-frontend.onrender.com,http://localhost:5173,http://localhost:8080

  # React + Vite Frontend
  - type: web
    name: evara-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://evara-backend-412x.onrender.com/api/v1
      # ⚠️ Sensitive values — set these in the Render dashboard, NOT here
      - key: VITE_SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # Set in Render dashboard

